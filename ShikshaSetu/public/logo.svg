<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bookLeft" x1="15" y1="35" x2="50" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="bookRight" x1="85" y1="35" x2="50" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="20" y1="50" x2="80" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="50" y1="10" x2="50" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Central Bridge Arch spanning upward from open book -->
  <path d="M 22 64 C 36 34, 64 34, 78 64 C 70 52, 30 52, 22 64 Z" fill="url(#bridgeGrad)" opacity="0.95" />
  
  <!-- Bridge suspenders/pillars subtle vertical lines -->
  <line x1="36" y1="44" x2="36" y2="58" stroke="#FDE68A" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <line x1="50" y1="38" x2="50" y2="55" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <line x1="64" y1="44" x2="64" y2="58" stroke="#FDE68A" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />

  <!-- Left Book Page -->
  <path d="M 50 78 C 38 71, 24 71, 14 74 L 14 42 C 25 38, 38 38, 50 45 Z" fill="url(#bookLeft)" />
  
  <!-- Right Book Page -->
  <path d="M 50 78 C 62 71, 76 71, 86 74 L 86 42 C 75 38, 62 38, 50 45 Z" fill="url(#bookRight)" />

  <!-- Central Spine Highlight -->
  <path d="M 50 45 L 50 78" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />

  <!-- Radiance of Knowledge / Morning Sun on Horizon -->
  <circle cx="50" cy="22" r="6" fill="url(#glowGrad)" />
  <path d="M 50 11 L 50 14" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
  <path d="M 40 15 L 42 17.5" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
  <path d="M 60 15 L 58 17.5" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
</svg>
